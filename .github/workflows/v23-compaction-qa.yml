name: V23 Compaction Qualification
on:
  push:
    branches:
      - qa/atlasnote-2.3-compaction-qualification
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: python tests/v23_compaction_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-compaction-qa
          path: docs/evidence/v23/compaction-qa
