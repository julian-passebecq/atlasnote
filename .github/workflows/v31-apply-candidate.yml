name: Apply and qualify V3.1 candidate
on:
  push:
    branches: [fix/atlasnote-v31-stabilization]
    paths:
      - docs/v31/candidate-edits-*.json
      - tools/v31-apply-candidate.py
      - .github/workflows/v31-apply-candidate.yml
permissions:
  contents: read
concurrency:
  group: atlasnote-v31-candidate-install
  cancel-in-progress: true
jobs:
  qualify:
    if: github.ref == 'refs/heads/fix/atlasnote-v31-stabilization'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply exact reviewed source edits
        run: |
          python tools/v31-apply-candidate.py
          rm docs/v31/candidate-edits-*.json tools/v31-apply-candidate.py .github/workflows/v31-apply-candidate.yml
          git add -A
          git config user.name 'AtlasNote candidate builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(v31): stabilize PDF geometry, recovery and cross-tab navigation; compact Norsk flag'
          mkdir -p /tmp/atlasnote-v31-candidate
          git archive --format=zip --output=/tmp/atlasnote-v31-candidate/atlasnote-source.zip HEAD
          git rev-parse HEAD > /tmp/atlasnote-v31-candidate/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: atlasnote-v31-candidate-source
          path: /tmp/atlasnote-v31-candidate
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run typecheck:online
      - run: npm test
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - name: Run every independent browser suite and retain failures
        shell: bash
        run: |
          failed=0
          for suite in v31_storage_runtime v31_pdf_runtime v3_runtime v3_pdf_window v3_norsk_daily v3_tabs v3_gates v3_pdf_labels pdf_navigation_runtime pdf_lifecycle_runtime; do
            python "tests/$suite.py" || failed=1
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v31-candidate-evidence
          path: |
            docs/evidence/v31
            docs/evidence/v3
            docs/evidence/pdf-navigation-runtime
            docs/evidence/pdf-lifecycle-runtime
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v31-candidate-dist-diagnostic
          path: dist
          retention-days: 7
      - name: Push tested source to the same development branch only
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/fix/atlasnote-v31-stabilization
          test -z "$(git status --porcelain)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/atlasnote-v31-stabilization
