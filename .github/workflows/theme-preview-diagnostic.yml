name: V2 theme preview diagnostic
on:
  push:
    branches: [v2manualupload]
    paths: ['tests/theme_stabilization_preview.py', '.github/workflows/theme-preview-diagnostic.yml']
permissions:
  contents: read
jobs:
  preview-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/theme_stabilization_preview.py
        env:
          ATLAS_BASE_URL: https://deploy-preview-13--atlasnotej.netlify.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v2-theme-preview-diagnostic
          path: docs/evidence/v2-stabilization/theme-preview
          retention-days: 7
