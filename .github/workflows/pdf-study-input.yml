name: Verify pinned public PDF study inputs
on:
  push:
    branches: [release/atlasnote-1.2.2-workspaces-pdf-companion]
    paths: [.github/workflows/pdf-study-input.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify existing reviewed public references
        run: |
          python3 - <<'PY'
          import pathlib, json, urllib.request, hashlib
          data=json.loads(pathlib.Path('content/packs/pdfatlas.public/atlas-documents.json').read_text())
          out=pathlib.Path('/tmp/pdf-study-inputs');out.mkdir()
          for doc in data['documents']:
              url=doc['source']['url']
              assert url.startswith('https://raw.githubusercontent.com/julian-passebecq/pdfatlas/fa5e83f7825cdc837078f87c5e130cb012332195/library/')
              with urllib.request.urlopen(url,timeout=30) as response: content=response.read(20*1024*1024+1)
              assert len(content)==doc['bytes']
              assert hashlib.sha256(content).hexdigest()==doc['sha256']
              (out/(doc['id']+'.pdf')).write_bytes(content)
          (out/'document-metadata.json').write_text(json.dumps(data,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-companion-reference-input
          path: /tmp/pdf-study-inputs
          retention-days: 1
          if-no-files-found: error
