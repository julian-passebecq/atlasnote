name: V2.3 provider-neutral qualification
# Owner publication suggestion: migration/atlasnote-2.3-cloudflare
# No deploy, GitHub write, production promotion, provider secret creation or cleanup writes.
on:
  workflow_call:
    inputs:
      preview_url:
        type: string
        required: false
        default: ''
      version_id:
        type: string
        required: false
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CF_ACCESS_CLIENT_ID:
        required: false
      CF_ACCESS_CLIENT_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact fresh protected immutable Cloudflare Worker version preview URL
        type: string
        required: true
      version_id:
        description: Exact Cloudflare Worker version UUID for the same preview
        type: string
        required: true
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      # V2.3 unit fixtures import dist-offline; hosted proof still uses only dist.
      - run: npm run build:offline
      - run: npm run build
      - run: npm run test:v23:core:portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-portable-core-not-release
          path: docs/evidence/v23/portable
  full-v23:
    needs: portable-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_V23_PROVIDER: cloudflare
      ATLAS_V23_PREVIEW_URL: ${{ inputs.preview_url }}
      ATLAS_CF_VERSION_ID: ${{ inputs.version_id }}
      ATLAS_CF_WORKER_NAME: ${{ vars.ATLAS_CF_WORKER_NAME || 'atlasnote-v23-qa' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      ATLAS_V23_NATIVE_QUOTA: '1'
      ATLAS_V23_QUOTA_SUDO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      # V2.3 unit fixtures import dist-offline; hosted proof still uses only dist.
      - run: npm run build:offline
      - run: npm run build
      # Read-only qualification only. This workflow never invokes Wrangler deploy/upload commands.
      - run: npm run test:v23:release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-full-release
          path: docs/evidence/v23/release
