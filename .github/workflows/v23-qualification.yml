name: V2.3 provider-neutral qualification
# Owner publication suggestion: migration/vercel-provider-neutral-v23
# No deploy, GitHub write, production promotion, provider secret creation or cleanup writes.
on:
  workflow_call:
    inputs:
      preview_url:
        type: string
        required: false
        default: ''
    secrets:
      VERCEL_TOKEN:
        required: false
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
  workflow_dispatch:
    inputs:
      preview_url:
        description: Exact fresh protected disposable preview URL, never a production alias
        type: string
        required: true
permissions:
  contents: read
jobs:
  portable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:v23:core:portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-portable-core-not-release
          path: docs/evidence/v23/portable
  full-v23:
    needs: portable-core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ATLAS_V23_PROVIDER: vercel
      ATLAS_V23_PREVIEW_URL: ${{ inputs.preview_url }}
      ATLAS_V23_NATIVE_QUOTA: '1'
      ATLAS_V23_QUOTA_SUDO: '1'
      ATLAS_VERCEL_TEAM_ID: ${{ vars.ATLAS_VERCEL_TEAM_ID }}
      ATLAS_VERCEL_PROJECT_ID: ${{ vars.ATLAS_VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      # No "continue-on-error". Missing preview/native capability remains BLOCKED.
      - run: npm run test:v23:release
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-full-release
          path: docs/evidence/v23/release
