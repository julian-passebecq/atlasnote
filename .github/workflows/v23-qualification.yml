name: V2.3 final-finish qualification (non-production)
on:
  push:
    branches:
      - final/atlasnote-2.3-pro-finish
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v23-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATLAS_V23_TIMEOUT_MS: 600000
      ATLAS_GITHUB_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build:offline
      - run: npm run build
      - run: npm run check:v23:build
      - run: git archive --format=zip --output="$RUNNER_TEMP/AtlasNote_Source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: atlasnote-v23-candidate-source
          path: ${{ runner.temp }}/AtlasNote_Source.zip
          if-no-files-found: error
      # This is an exact-candidate integrated artifact, not a release approval.
      - uses: actions/upload-artifact@v4
        with:
          name: atlasnote-v23-qualification-dist
          path: dist
          if-no-files-found: error
      # Resolve a disposable draft preview for this exact commit. This writes
      # only an ephemeral runner URL, never a Netlify runtime secret/config.
      - name: Resolve exact candidate disposable preview
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const repo=process.env.GITHUB_REPOSITORY,branch=process.env.GITHUB_REF_NAME;
          const q=new URLSearchParams({state:'open',head:repo.split('/')[0]+':'+branch});
          const r=await fetch('https://api.github.com/repos/'+repo+'/pulls?'+q,{headers:{Authorization:'Bearer '+process.env.ATLAS_GITHUB_READ_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('Preview lookup failed: '+r.status);
          const pr=(await r.json()).find(p=>p.draft&&p.head.sha===process.env.GITHUB_SHA&&p.head.repo?.full_name===repo);
          if(pr)fs.appendFileSync(process.env.GITHUB_ENV,'ATLAS_V23_PREVIEW_URL=https://deploy-preview-'+pr.number+'--atlasnotej.netlify.app\n');
          else console.log('No exact-candidate disposable draft preview: the provider gate will remain BLOCKED.');
          NODE
      # Exit 2 remains a failing workflow. No continue-on-error or success masking.
      - run: npm run test:v23:release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-finish-qualification
          path: docs/evidence/v23
          if-no-files-found: error
  # Supplemental continuation, not a substitute for the unchanged inherited
  # workflow. It preserves visibility into V2.2 regressions even while a provider
  # prerequisite keeps the mandatory V2.3 aggregate (and canonical CI) non-green.
  inherited-post-gate-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt -r requirements-pdf-authoring.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build:offline
      - run: npm run build
      - run: npm run build:test-harness
      - run: npm run test:pdf:component
      - run: npm run test:pdf:grid
      - run: npm run test:pdf:wheel
      - run: npm run test:pdf
      - run: npm run test:finish:integrated
      - run: npm run test:runtime
      - run: npm run test:workspaces:runtime
      - run: npm run test:savedstates:runtime
      - run: npm run test:reading:runtime
      - run: npm run test:cheatsheets:runtime
      - run: npm run test:content-hub:runtime
      - run: npm run test:references
      - run: npm run test:references:ui
      - run: npm run test:references:runtime
      - run: npm run test:stabilization:runtime
      - run: npm run test:final-polish:runtime
      - run: npm run test:release-blockers:runtime
      - run: npm run test:history
      - run: npm run test:agent
      - run: npm run check:pdfatlas
      - run: npm run test:v22:runtime
      - run: npm run test:completion:runtime
      - run: npm run test:pdf:lifecycle
      - run: npm run test:headers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-inherited-continuation-diagnostic
          path: docs/evidence
          if-no-files-found: error
