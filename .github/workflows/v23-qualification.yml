name: V2.3 consolidated qualification
on:
  push:
    branches:
      - final/atlasnote-2.3-consolidated
      - final/atlasnote-2.3-pro-finish
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v23-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build
      - run: npm run check:v23:build
      - run: npm run test:v23:recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-v23-consolidated-qualification
          path: docs/evidence/v23
