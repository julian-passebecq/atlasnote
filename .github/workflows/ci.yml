name: Validate, build and release gates

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic Node dependencies
        run: npm ci --ignore-scripts

      - name: Install deterministic Python test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.txt

      - name: Install pdftoppm for PDF visual smoke tests
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: TypeScript gate
        run: npm run typecheck

      - name: Unit and regression suite
        run: npm test

      - name: Build deployable artifact
        run: npm run build

      - name: Content validator
        run: npm run validate

      - name: Full release gate bundle
        run: npm run release:gates

      - name: Upload deployable artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlasnote-dist
          path: dist/
          if-no-files-found: error

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlasnote-release-evidence
          path: evidence/release-gates/
          if-no-files-found: warn
