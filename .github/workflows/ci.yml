name: Integrated production and compatibility release gates
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Exact committed dependencies only. Never author a new lockfile in CI.
      - run: npm ci
      - run: npm run check:integrated-deps
      - run: npm audit
      - run: npm run typecheck
      # pretest builds dist-offline, never dist.
      - run: npm test
      - run: npm run check:release:offline
      - run: npm run test:online:syntax
      - run: npm run audit:local
      - run: python -m pip install -r requirements-test.txt -r requirements-pdf-authoring.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:dom
      - run: npm run test:hardening:ui
      - run: npm run test:reader:ui
      - run: npm run test:compact:ui
      - run: npm run test:finish:ui
      - run: npm run test:workspaces:ui
      - run: npm run test:simplified:ui
      - run: npm run test:reading:ui
      - run: npm run test:interviews
      - run: npm run test:polish:ui
      - run: npm run test:cheatsheets
      - run: npm run test:cheatsheets:ui
      - run: npm run test:backup:diagnostic
      - run: npm run test:pdf:authoring
      # Build the exact hosted distribution after all compatibility suites.
      - run: npm run typecheck:online
      - run: npm run build
      - run: npm run check:release
      - run: npm run build:test-harness
      - run: npm run test:pdf:component
      - run: npm run test:pdf:grid
      - run: npm run test:pdf:wheel
      - run: npm run test:pdf
      - run: npm run test:finish:integrated
      # Actual normal origin + IndexedDB + real browser download/fresh restore.
      # A FAIL or BLOCKED result deliberately prevents the release artifact.
      - run: npm run test:runtime
      - run: npm run test:workspaces:runtime
      - run: npm run test:savedstates:runtime
      - run: npm run test:reading:runtime
      - run: npm run test:cheatsheets:runtime
      - run: npm run test:headers
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-release-evidence
          path: docs/evidence
      - uses: actions/upload-artifact@v4
        with:
          name: atlasnote-integrated-production-dist
          path: dist
          if-no-files-found: error
