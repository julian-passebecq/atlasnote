name: AtlasNote 1.2.2 integrated workspace acceptance
on:
  push:
    branches: [release/atlasnote-1.2.2-workspaces-pdf-companion]
    paths:
      - .github/workflows/implement-122.yml
      - src/**
      - tests/workspace_122_runtime.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspaces-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build:offline && npm run build
      - name: Real-origin workspace, wheel, companion, migration and backup tests
        run: timeout 240s npm run test:workspaces:runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-122-priority-runtime
          path: docs/evidence/1.2.2/runtime
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve exact tested source
        if: always()
        run: git archive --format=zip HEAD -o /tmp/atlasnote-122-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-122-priority-source
          path: /tmp/atlasnote-122-source.zip
          retention-days: 14
