name: Correct and verify AtlasNote 1.2.2 acceptance
on:
  push:
    branches: [release/atlasnote-1.2.2-workspaces-pdf-companion]
    paths: [.github/workflows/fix-122-validation.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/atlasnote-1.2.2-workspaces-pdf-companion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct harness variable and assert user-visible zoom dimensions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/workspace_122_runtime.py');s=p.read_text();assert s.count('if new_tab:')==1;s=s.replace('if new_tab:','if new:');p.write_text(s)
          p=Path('tests/pdf_runtime.py');s=p.read_text()
          old="phase='zoom';w=p.locator('canvas').first.evaluate('e=>e.width');p.get_by_role('combobox',name='PDF zoom',exact=True).select_option('1.5');p.wait_for_timeout(300);assert p.locator('canvas').first.evaluate('e=>e.width')>=w*1.3;record(phase)"
          new="phase='zoom';w=p.locator('canvas').first.evaluate('e=>e.getBoundingClientRect().width');p.get_by_role('combobox',name='PDF zoom',exact=True).select_option('1.5');p.wait_for_function('(w)=>document.querySelector(\"canvas\").getBoundingClientRect().width>=w*1.3',arg=w,timeout=10000);after=p.locator('canvas').first.evaluate('e=>e.getBoundingClientRect().width');assert after>=w*1.3,(w,after);record(phase,{'displayWidthBefore':w,'displayWidthAfter':after})"
          assert old in s;s=s.replace(old,new);p.write_text(s)
          PY
          git config user.name 'AtlasNote implementation'
          git config user.email '64646018+julian-passebecq@users.noreply.github.com'
          git add tests/workspace_122_runtime.py tests/pdf_runtime.py
          git commit -m 'Fix workspace acceptance parameter and measure actual visible PDF zoom'
          git push origin HEAD:release/atlasnote-1.2.2-workspaces-pdf-companion
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt -r requirements-pdf-authoring.txt
      - run: python -m playwright install --with-deps chromium
      - run: npm run build:offline && npm run build
      - name: Actual workspace runtime acceptance
        run: timeout 240s npm run test:workspaces:runtime
      - name: Existing physical PDF runtime acceptance
        run: timeout 120s npm run test:pdf
      - name: All release gates
        run: node tools/run-release.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-122-verified-evidence
          path: docs/evidence
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-122-verified-dist
          path: dist
          retention-days: 14
      - name: Preserve full source
        if: always()
        run: |
          git archive --format=zip HEAD -o /tmp/atlasnote-122-source.zip
          git rev-parse HEAD > /tmp/atlasnote-122-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-122-verified-source
          path: |
            /tmp/atlasnote-122-source.zip
            /tmp/atlasnote-122-commit.txt
          retention-days: 14
