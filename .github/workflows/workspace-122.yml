name: Prepare isolated 1.2.2 workspace inputs
on:
  push:
    branches: [release/atlasnote-1.2.2-workspaces-pdf-companion]
    paths: [.github/workflows/workspace-122.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm audit --json > /tmp/atlasnote-npm-audit.json
      - name: Package tracked source and resolved build dependencies
        shell: bash
        run: |
          git bundle create /tmp/atlasnote-baseline.bundle HEAD
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          root=pathlib.Path.cwd()
          names=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          inventory={}
          with zipfile.ZipFile('/tmp/atlasnote-workspace-inputs.zip','w',zipfile.ZIP_DEFLATED,compresslevel=4) as z:
              for name in names:
                  if not name: continue
                  path=root/name
                  if path.is_file():
                      z.write(path,'source/'+name)
                      inventory[name]=hashlib.sha256(path.read_bytes()).hexdigest()
              for path in (root/'node_modules').rglob('*'):
                  if path.is_file(): z.write(path,'dependencies/'+str(path.relative_to(root)))
              z.write('/tmp/atlasnote-baseline.bundle','atlasnote-baseline.bundle')
              z.write('/tmp/atlasnote-npm-audit.json','npm-audit.json')
              z.writestr('source-sha256.json',json.dumps(inventory,indent=2))
              z.writestr('provenance.json',json.dumps({'baseline':'13409ca61e2cf6c2a60c45a04b9e662f6049b071','head':subprocess.check_output(['git','rev-parse','HEAD']).decode().strip()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atlasnote-122-workspace-inputs
          path: /tmp/atlasnote-workspace-inputs.zip
          retention-days: 7
          if-no-files-found: error
