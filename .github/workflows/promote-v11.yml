name: Finalize AtlasNote 1.1 transfer
on:
  push:
    branches:
      - release/atlasnote-1.1-v5-final
    paths:
      - .github/workflows/promote-v11.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/atlasnote-1.1-v5-final
          fetch-depth: 0
      - name: Apply verified AtlasNote 1.1 source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .atlasnote-transfer/chunk-000 \
            .atlasnote-transfer/chunk-001 \
            .atlasnote-transfer/chunk-002 \
            .atlasnote-transfer/chunk-003005 \
            .atlasnote-transfer/chunk-006008 \
            .atlasnote-transfer/chunk-009011 \
            .atlasnote-transfer/chunk-012014 \
            .atlasnote-transfer/chunk-015017 \
            .atlasnote-transfer/chunk-018020 \
            .atlasnote-transfer/chunk-021 \
            .atlasnote-transfer/chunk-022 \
            .atlasnote-transfer/chunk-023 \
            .atlasnote-transfer/chunk-024025 \
            | base64 -d > /tmp/atlasnote.patch.xz
          echo "13cefcf1888aed7e6329f4eb438e4486ae2c2b02d93434914346b7098bb5ca76  /tmp/atlasnote.patch.xz" | sha256sum -c -
          xz -dc /tmp/atlasnote.patch.xz > /tmp/atlasnote.patch
          git apply --binary --reject /tmp/atlasnote.patch || true
          cp .atlasnote-transfer/workspace.final.ts src/core/workspace.ts
          rm -f src/core/workspace.ts.rej
          rm -rf .atlasnote-transfer
          rm -f .github/workflows/promote-v11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AtlasNote 1.1 release"
          git push origin HEAD:release/atlasnote-1.1-v5-final
