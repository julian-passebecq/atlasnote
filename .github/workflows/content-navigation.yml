name: Study samples and PDF navigation regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/study-samples.test.mjs
      - run: npm run build
      - run: npm run test:study-samples:runtime
      - run: npm run test:pdf:navigation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlasnote-content-navigation-evidence
          path: |
            docs/evidence/study-samples-runtime
            docs/evidence/pdf-navigation-runtime
